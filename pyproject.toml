[tool.poetry]
name = "my-project-oop"
version = "0.1.0"
description = ""
authors = ["Alexej Matsenko <matsenko.alexej@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
pytest = "^9.0.3"
mock-open = "^1.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]


[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''
(
  /(\.git)  # Исключить папку .git
)
'''

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'